<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOUGLAS Net</title>
  <!-- This links the CSS file. Without this, no styling will show -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGO AT TOP -->
  <p><span class="logo">DOUGLAS Net</span></p>

  <!-- LOGIN BOX: input + button side by side -->
  <div id="login">
    <input placeholder="Enter your voucher code">
    <button>login</button>
  </div>

  <!-- SEARCH FOR OLD VOUCHER -->
  <input type="search" placeholder="Already bought? Find My Voucher....">

  <!-- TITLE ABOVE PACKAGES -->
  <p class="title">Select a package and pay with mobile money</p>

  <!-- WRAPPER FOR ALL PACKAGES - keeps them in a column -->
  <div id="pack">

    <!-- PACKAGE 1 -->
    <div class="items">
      <!-- .time = green text, this is the package name -->
      <span class="time">MEGA 4HOURS</span>
      <!-- .price = white text, this is the price -->
      <span class="price">UGX 700</span>
      <!-- Buy button -->
      <button>BUY</button>
    </div>

    <!-- PACKAGE 2 -->
    <div class="items">
      <span class="time">12hours</span>
      <span class="price">Ugx 1000</span>
      <button>buy</button>
    </div>

    <!-- PACKAGE 3 -->
    <div class="items">
      <span class="time">24 hours</span>
      <span class="price">Ugx 1500</span>
      <button>buy</button>
    </div>

    <!-- PACKAGE 4 -->
    <div class="items">
      <span class="time">MEGA 3 days</span>
      <span class="price">Ugx 3000</span>
      <button>buy</button>
    </div>

    <!-- PACKAGE 5 -->
    <div class="items">
      <span class="time">Weekly</span>
      <span class="price">Ugx 6000</span>
      <button>buy</button>
    </div>

    <!-- PACKAGE 6 -->
    <div class="items">
      <span class="time">monthly</span>
      <span class="price">Ugx 25000</span>
      <button>buy</button>
    </div>

    <!-- PAYMENT METHODS -->
    <div id="item">
      We accept:
      <span><img alt="airtel"><img alt="mtn"></span>
    </div>

  </div>

  <!-- HELP TEXT -->
  <p id="help">Need help, Contact support:</p>
  <!-- PHONE NUMBER - green -->
  <p><span class="phone">0709612408</span></p>

  <!-- FOOTER -->
  <footer>powered by <span>GabiFi</span></footer>
  <footer>Terms and conditions apply</footer>

  <script src="main.js"></script>
</body>
</html>
